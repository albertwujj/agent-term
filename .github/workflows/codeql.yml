# CodeQL, as GitHub's default setup ran it (same languages, suite and
# triggers), minus the tests: test code never ships, and its alerts were all
# dismissed as used in tests.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - test
              - '**/*.test.js'
              - '**/*_test.py'
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
