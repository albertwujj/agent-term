<svg xmlns="http://www.w3.org/2000/svg" width="720" height="582" viewBox="0 0 720 582" role="img" aria-labelledby="title description">
  <title id="title">AgentTerm, editable agent guides, IDEs and your phone</title>
  <desc id="description">Multiple AgentTerm instances run on both macOS and Windows with WSL. Each instance keeps its AI CLI, documents and reviews together on its own computer. The AI CLIs read editable Markdown guides from companion repositories. For example, agent-threads guides curated reviews and document feedback; editing those guides customizes the agent’s behavior. An external IDE can exchange code references over an open JSON protocol through a plugin; the available integration is for JetBrains IDEs. Sessions from all computers can connect over HTTPS to the same optional, self-hosted agent-stream-hub relay. A phone or browser connects to the hub to view sessions and reply.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#687681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #24292f; }
      .host { font-size: 18px; font-weight: 600; }
      .name { font-size: 21px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 16px; fill: #57606a; text-anchor: middle; }
      .ide { font-size: 18px; text-anchor: middle; }
      .ide-detail { font-size: 14px; fill: #57606a; text-anchor: middle; }
      .edge { fill: none; stroke: #687681; stroke-width: 1.5; }
      .guide-edge { stroke-dasharray: 5 4; }
      .both { marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-label { font-size: 14px; fill: #57606a; }
      .node { fill: #ffffff; stroke: #aeb8c2; stroke-width: 1.2; }
      .computer { fill: #f6f8fa; stroke: #d0d7de; }
      .session { stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="720" height="582" rx="10" fill="#ffffff"/>

  <g aria-label="Editable agent guides in companion repositories">
    <rect x="112" y="12" width="496" height="104" rx="8" fill="#f6f3f8" stroke="#aaa0b5" stroke-width="1.2"/>
    <text class="name" x="360" y="41">Agent guides</text>
    <text class="detail" x="360" y="66">Editable Markdown · companion repos</text>
    <text class="detail" x="360" y="92" style="font-size: 15px">Curated reviews, document feedback, and more</text>
  </g>
  <g transform="translate(0 136)">

    <g aria-label="Mac computer">
      <rect class="computer" x="16" y="12" width="328" height="258" rx="10"/>
      <text class="host" x="32" y="40">macOS</text>

      <rect class="node" x="48" y="58" width="264" height="60" rx="6"/>
      <text class="ide" x="180" y="82">External IDE</text>
      <text class="ide-detail" x="180" y="105">Optional · JetBrains plugin</text>
      <path class="edge both" d="M 172 122 V 154"/>
      <text class="edge-label" x="185" y="143">Open JSON protocol</text>

      <rect class="session" x="48" y="158" width="280" height="78" rx="7" fill="#f8f3e7" stroke="#b2a075"/>
      <rect class="session" x="40" y="166" width="280" height="78" rx="7" fill="#edf4ef" stroke="#87a18e"/>
      <rect class="session" x="32" y="174" width="280" height="78" rx="7" fill="#edf4f8" stroke="#7895aa"/>
      <text class="name" x="172" y="207">AgentTerm instances</text>
      <text class="detail" x="172" y="233">AI CLI · docs · reviews</text>
    </g>

    <g aria-label="Windows computer with WSL">
      <rect class="computer" x="376" y="12" width="328" height="258" rx="10"/>
      <text class="host" x="392" y="40">Windows + WSL</text>

      <rect class="node" x="408" y="58" width="264" height="60" rx="6"/>
      <text class="ide" x="540" y="82">External IDE</text>
      <text class="ide-detail" x="540" y="105">Optional · JetBrains plugin</text>
      <path class="edge both" d="M 532 122 V 154"/>
      <text class="edge-label" x="545" y="143">Open JSON protocol</text>

      <rect class="session" x="408" y="158" width="280" height="78" rx="7" fill="#edf4f8" stroke="#7895aa"/>
      <rect class="session" x="400" y="166" width="280" height="78" rx="7" fill="#f8f3e7" stroke="#b2a075"/>
      <rect class="session" x="392" y="174" width="280" height="78" rx="7" fill="#edf4ef" stroke="#87a18e"/>
      <text class="name" x="532" y="207">AgentTerm instances</text>
      <text class="detail" x="532" y="233">AI CLI · docs · reviews</text>
    </g>

    <path class="edge" d="M 172 256 V 286 Q 172 294 180 294 H 310" marker-start="url(#arrow)"/>
    <path class="edge" d="M 532 256 V 286 Q 532 294 524 294 H 310" marker-start="url(#arrow)"/>
    <circle cx="310" cy="294" r="2.5" fill="#687681"/>
    <path class="edge" d="M 310 294 V 347" marker-end="url(#arrow)"/>
    <text class="edge-label" x="328" y="317">Session updates &amp; replies</text>
    <text class="edge-label" x="328" y="338">HTTPS</text>

    <rect class="node" x="176" y="351" width="268" height="78" rx="7"/>
    <text class="name" x="310" y="383">agent-stream-hub</text>
    <text class="detail" x="310" y="410">Self-hosted relay · optional</text>

    <path class="edge both" d="M 448 393 H 504"/>
    <text class="edge-label" x="476" y="378" text-anchor="middle">HTTPS</text>

    <rect class="node" x="508" y="351" width="196" height="78" rx="7"/>
    <text class="name" x="606" y="383">Phone / browser</text>
    <text class="detail" x="606" y="410">View sessions · reply</text>
  </g>

  <path class="edge guide-edge" d="M 360 120 V 369"/>
  <text class="edge-label" x="376" y="138">Read by AI CLIs</text>
  <path class="edge guide-edge" d="M 360 369 H 332" marker-end="url(#arrow)"/>
  <path class="edge guide-edge" d="M 360 369 H 388" marker-end="url(#arrow)"/>
</svg>
