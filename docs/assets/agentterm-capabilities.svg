<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title description">
  <title id="title">AgentTerm adds a visual workspace around a familiar terminal</title>
  <desc id="description">The user can work through the familiar terminal or directly on rendered, interactive documents and code in the same AgentTerm window. The core terminal keeps the shell and existing AI CLI. The agent's work can be presented in rendered pages, and feedback returns to the same agent. Around this core, AgentTerm adds session tools, clickable file references, document lookup, comments, clean copying and optional IDE and phone connections. AgentTerm integrates its window with the operating system, including the Dock or taskbar, window switching and previews. This is a capability map rather than a process or screen layout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#607080" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #24292f; }
      .title { font-size: 28px; font-weight: 650; }
      .name { font-size: 21px; font-weight: 600; }
      .detail { font-size: 18px; fill: #57606a; }
      .label { font-size: 16px; fill: #57606a; text-anchor: middle; }
      .edge { fill: none; stroke: #607080; stroke-width: 1.7; stroke-linejoin: round; }
      .both { marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="860" rx="12" fill="#ffffff"/>

  <rect x="418" y="40" width="164" height="68" rx="34" fill="#f6f8fa" stroke="#aeb8c2" stroke-width="1.3"/>
  <text class="title" x="500" y="84" text-anchor="middle">You</text>

  <text class="label" x="240" y="136">Use the familiar CLI</text>
  <text class="label" x="760" y="136">Work on the rendered pages</text>

  <rect x="36" y="196" width="928" height="476" rx="14" fill="#f2f7fc" stroke="#7895aa" stroke-width="1.6"/>
  <text class="title" x="70" y="239">AgentTerm</text>
  <text class="detail" x="70" y="269">One agent's window · focus moves with your work</text>

  <rect x="86" y="310" width="300" height="190" rx="9" fill="#f6f8fa" stroke="#aeb8c2" stroke-width="1.3"/>
  <text x="110" y="348" font-family="monospace" font-size="28" fill="#57606a">&gt;_</text>
  <text class="name" x="164" y="347">Core terminal</text>
  <text class="detail" x="110" y="386">Your shell and AI CLI</text>
  <text class="detail" x="110" y="416">Familiar text interaction</text>
  <text class="detail" x="110" y="465">Prompts ↔ CLI output</text>

  <rect x="556" y="310" width="358" height="190" rx="9" fill="#e8f0fb" stroke="#6f8fb0" stroke-width="1.3"/>
  <text class="name" x="578" y="339">Documents and code</text>
  <text class="detail" x="578" y="365">Rendered and interactive</text>
  <text class="detail" x="578" y="389">in the same terminal window</text>
  <text class="detail" x="578" y="423">Plans · drafts · code walkthroughs</text>
  <text class="detail" x="578" y="449">Revisions update in place</text>
  <text class="detail" x="578" y="480">Discussion beside the passage</text>

  <path class="edge" d="M 390 374 H 551" marker-end="url(#arrow)"/>
  <text class="label" x="471" y="359">Agent's work</text>
  <path class="edge" d="M 552 436 H 391" marker-end="url(#arrow)"/>
  <text class="label" x="471" y="461">Your feedback</text>

  <rect x="86" y="548" width="252" height="106" rx="9" fill="#edf4ef" stroke="#87a18e" stroke-width="1.2"/>
  <text class="name" x="106" y="580" style="font-size:20px">Session tools</text>
  <text class="detail" x="106" y="611" style="font-size:16px">Find &amp; resume sessions</text>
  <text class="detail" x="106" y="635" style="font-size:16px">Distinct window identity</text>

  <rect x="366" y="548" width="268" height="106" rx="9" fill="#fff6e8" stroke="#b2a075" stroke-width="1.2"/>
  <text class="name" x="386" y="580" style="font-size:20px">Text &amp; file actions</text>
  <text class="detail" x="386" y="611" style="font-size:16px">Click to open · find docs</text>
  <text class="detail" x="386" y="635" style="font-size:16px">Comment · copy cleanly</text>

  <rect x="662" y="548" width="252" height="106" rx="9" fill="#f6f3f8" stroke="#aaa0b5" stroke-width="1.2"/>
  <text class="name" x="682" y="580" style="font-size:20px">Optional connections</text>
  <text class="detail" x="682" y="611" style="font-size:16px">IDE navigation</text>
  <text class="detail" x="682" y="635" style="font-size:16px">Phone access</text>

  <path class="edge both" d="M 446 112 V 151 H 20 V 405 H 82"/>
  <path class="edge both" d="M 554 112 V 151 H 980 V 405 H 918"/>
  <path class="edge both" d="M 500 676 V 725"/>
  <text class="detail" x="520" y="709" style="font-size:16px">Window &amp; OS integration</text>
  <rect x="36" y="730" width="928" height="101" rx="12" fill="#f6f8fa" stroke="#aeb8c2" stroke-width="1.3"/>
  <text class="title" x="70" y="769">Operating system</text>
  <text class="detail" x="70" y="804">OS windows · Dock / taskbar · switching · previews</text>
</svg>
